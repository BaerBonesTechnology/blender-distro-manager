<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'"
    />
    <title>Blender Distro Manager</title>
    <link rel="stylesheet" href="../web/style.css" />
    <script src="../web/theme.js" defer></script>
    <script src="renderer.js" defer></script>
  </head>
  <body class="app">
    <header>
      <strong>Blender Distro Manager</strong
      ><select id="theme" class="theme-select" aria-label="Theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </header>
    <main>
      <div class="tabs" role="tablist" aria-label="Manager">
        <button
          id="tab-installed"
          role="tab"
          aria-controls="installed"
          aria-selected="true"
        >
          Installed</button
        ><button
          id="tab-download"
          role="tab"
          aria-controls="download"
          aria-selected="false"
          tabindex="-1"
        >
          Download</button
        ><button
          id="tab-addons"
          role="tab"
          aria-controls="addon-panel"
          aria-selected="false"
          tabindex="-1"
        >
          Add-ons
        </button>
      </div>
      <p id="status" class="status" role="status"></p>
      <section id="installed" role="tabpanel" aria-labelledby="tab-installed">
        <h1>Installed</h1>
        <p>Manage your Blender installations.</p>
        <div class="toolbar">
          <label
            >Build name<input
              id="name"
              value="My Blender"
              maxlength="100" /></label
          ><button id="import">Import existing build</button>
        </div>
        <div id="installs" class="grid"></div>
      </section>
      <section
        id="download"
        role="tabpanel"
        aria-labelledby="tab-download"
        hidden
      >
        <h1>Download</h1>
        <p>
          Download and install a release for this computer. Installed builds
          keep their own settings.
        </p>
        <div id="catalog" class="grid"></div>
      </section>
      <section
        id="addon-panel"
        role="tabpanel"
        aria-labelledby="tab-addons"
        hidden
      >
        <h1>Add-ons</h1>
        <p>
          Import a trusted pure-Python legacy add-on and assign it to a
          compatible build. Enable it in Blender’s preferences.
        </p>
        <div class="actions"><button id="addon">Import add-on</button></div>
        <div id="addons" class="grid"></div>
      </section>
    </main>
  </body>
</html>
